name: call_aaya
description: "Call Aaya - get a fun fake incoming call from original desi characters."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Dart 3.6 = Flutter 3.27 or newer (needed for Color.withValues).
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ringtone.wav
