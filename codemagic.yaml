# Builds an installable Android APK on Codemagic (free tier is enough).
# Push this folder to a GitHub repo, add the repo in Codemagic, start "Call Aaya – test APK".
workflows:
  android-apk:
    name: Call Aaya – test APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Create the Android project files
        script: |
          flutter create --org com.callaaya --platforms android --project-name call_aaya .
          rm -f test/widget_test.dart
      - name: Set up desugaring and release keep-rules
        script: |
          python3 tool/prepare_android.py
          cat android/app/build.gradle* android/app/proguard-rules.pro
      - name: Get packages
        script: flutter pub get
      - name: Check the code
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build the APK
        script: flutter build apk --release
      - name: Build the debug APK (shows errors on screen instead of closing)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
